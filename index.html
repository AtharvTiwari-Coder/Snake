<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game Menu</title>
  <link rel="stylesheet" href="SnakeMenuCSS.css" />
  <script defer src="SnakeMenuJS.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <img src="https://raw.githubusercontent.com/AtharvTiwari-Coder/Snake/3d40fd175a722eaf6d3af02333a383fcef19bea9/Snake-LOGO.png" 
         alt="Snake Game Logo" class="loading-logo" />
  </div>

  <!-- Main Menu -->
  <header class="menu-header">
    <h1>Snake Game</h1>
    <nav class="menu-nav">
      <button id="playBtn">Play</button>
      <button id="shopBtn">Shop</button>
      <button id="snakesBtn">Snakes</button>
      <button id="settingsBtn">Settings</button>
    </nav>
  </header>

  <!-- Sections -->
  <main class="menu-sections">
    <section id="playSection" class="hidden">
      <h2>Play Snake</h2>
      <p>Start the game and slither to victory!</p>
    </section>

    <section id="shopSection" class="hidden">
      <h2>Shop</h2>
      <p>Buy skins, upgrades, and more.</p>
    </section>

    <section id="snakesSection" class="hidden">
      <h2>Snakes</h2>
      <p>Choose your snake style and color.</p>
    </section>

    <section id="settingsSection" class="hidden">
      <h2>Settings</h2>
      <p>Adjust game preferences and controls.</p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 Snake Game by ATHARV | Logo hosted on GitHub</p>
  </footer>

</body>
</html>
