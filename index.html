<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game Settings</title>
  <link rel="stylesheet" href="SnakeMenuCSS.css" />
  <script defer src="SnakeMenuJS.js"></script>
</head>
<body style="background-image: url('https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Background.png'); background-size: cover;">

  <!-- Logo -->
  <div class="logo-container">
    <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-LOGO.png" alt="Snake Logo" class="logo" />
  </div>

  <!-- Header -->
  <header class="menu-header">
    <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Back_To_Menu-Arrow.png" class="back-arrow" alt="Back" />
    <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Settings_icon.png" class="settings-icon" alt="Settings" />
  </header>

  <!-- Settings Panel -->
  <main class="settings-panel">
    <h1>Settings</h1>

    <!-- Name Input -->
    <div class="setting-group">
      <input type="text" placeholder="Enter Name" class="text-input" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Apply_Button.png" class="apply-button" alt="Apply" />
    </div>

    <!-- Game Quality -->
    <div class="setting-group">
      <label>Game Quality:</label>
      <select class="quality-selector">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
    </div>

    <!-- Audio -->
    <div class="setting-group">
      <label>Audio:</label>
      <input type="range" class="slider" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Bar_Knob.png" class="slider-knob" alt="Knob" />
      <input type="number" class="integer-input" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Bell_Icon.png" class="bell-icon" alt="Bell" />
    </div>

    <!-- Sensitivity -->
    <div class="setting-group">
      <label>Sensitivity:</label>
      <input type="range" class="slider" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Bar_Knob.png" class="slider-knob" alt="Knob" />
      <input type="number" class="integer-input" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Reset_Button.png" class="reset-button" alt="Reset" />
    </div>

    <!-- FOV -->
    <div class="setting-group">
      <label>Field of View:</label>
      <input type="range" class="slider" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Bar_Knob.png" class="slider-knob" alt="Knob" />
      <input type="number" class="integer-input" />
      <img src="https://github.com/AtharvTiwari-Coder/Snake/blob/Backgrounds-%26-Images/Snake-Menu-Settings-Reset_Button.png" class="reset-button" alt="Reset" />
    </div>
  </main>
</body>
</html>
